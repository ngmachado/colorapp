# Source-aware introductions. Each page in the app links to the knowledge records it summarises.

- id: tradition-wuxing
  kind: tradition
  title: Wuxing, the Five Phases
  summary: Wood, fire, earth, metal and water describe interconnected processes and correspondences, not chemical elements. Colour associations are symbolic relationships with a source, never hue-angle rules or mixing rules.
  explanation_limits: Show the generating and controlling cycles as documented relationships. A palette adapted from them is an adaptation, labelled as such.
  sources: [iep-wuxing-littlejohn]

- id: tradition-japanese-colour
  kind: tradition
  title: Japanese colour names, dictionaries and layering
  summary: An authored dictionary (Wada), a traditional vocabulary (nihon no iro), an industrial naming standard (JIS Z 8102, 269 names with Munsell notations) and a clothing practice (kasane) are different kinds of record. The app keeps them apart and shows each record's evidence and status.
  explanation_limits: Do not prefilter Japanese records as "muted" or "minimalist". Wada records show bibliographic data only until permission exists. JIS names carry the standard's Munsell notation; the screen value beside it is a reference approximation, not a conversion of the notation.
  sources: [seigensha-wada-vol1, seigensha-wada-vol2, japan-house-living-colours, jis-z8102-2001]

- id: tradition-western
  kind: tradition
  title: Historical perspectives on perception
  summary: Chevreul's account of simultaneous contrast (1839), Itten's teaching (1961) and Albers's exercises in relativity (1963) have different purposes. Chevreul is quoted with paragraph references; Itten and Albers have bibliographic entries only.
  explanation_limits: Attribute historical claims to their authors. A historical pairing is not automatically an opposite in OKLCh or a modern law of perception.
  sources:
    [
      chevreul-1890-principles-martel,
      itten-art-of-color-wiley,
      albers-interaction-of-color-yale-2013,
    ]
