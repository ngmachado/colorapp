# Display approximations for kasane names from the Japanese Wikipedia list 日本の色の一覧 (discovery route only).
# Where the English and Japanese pages disagree, both values are recorded and the disagreement stays in notes.

- type: representation
  id: ja-ao-srgb-jawiki
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wikipedia-ja-nihon-no-iro-ichiran, locator: 'entry 青 (あお), hex #0067C0' }
  concept: ja-ao
  space: srgb
  coords: [0.00000, 0.40392, 0.75294]
  white: D65
  method: 'sRGB hex #0067C0 as listed on the cited page (which calls its values approximate examples and names no source), divided by 255.'
  approximation_status: modern-approximation
  notes: The kasane table uses 青 for both layers of 菖蒲; the term historically spans blue and green. This value is one modern reading.

- type: representation
  id: ja-shiro-srgb-jawiki
