# yaml-language-server: $schema=../schema.json
# Japanese candidate vocabulary. Everything here is in review state `discovered`: the spellings were read from the
# cited page and the colour values are that page's uncited modern approximations. Nothing is publication-ready.

- type: concept
  id: ja-ai
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wikipedia-en-traditional-colors-of-japan, locator: 'table row 藍色' }
  label: 藍色
  description: Japanese traditional colour name; the cited page glosses it as "Indigo color".
  tags: { tradition: japanese, language: ja }

- type: name
  id: ja-ai-name
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wikipedia-en-traditional-colors-of-japan, locator: 'table row 藍色' }
  concept: ja-ai
  script: 藍色
  language: ja
  transliteration: { system: Hepburn, value: ai-iro }
  meaning: 'Indigo color'
  confidence: { transcription: 1 }
  notes: Candidate list says "Ai" (藍, the indigo plant); the cited page lists the colour name 藍色 (ai-iro).

- type: representation
  id: ja-ai-srgb-wikipedia
  review_state: discovered
  rights_status: unreviewed
  evidence:
    { source: wikipedia-en-traditional-colors-of-japan, locator: 'table row 藍色, hex #264348' }
  concept: ja-ai
  space: srgb
  coords: [0.14902, 0.26275, 0.28235]
  white: D65
  method: 'sRGB hex #264348 as listed on the cited page (which gives no per-value source), divided by 255.'
  approximation_status: modern-approximation

