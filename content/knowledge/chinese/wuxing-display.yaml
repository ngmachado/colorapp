# Editorial display markers for the four Wuxing colour categories without a documented value (赤 has one from the
# Chinese Wikipedia page). Each is an app choice, labelled as such; the category entries say that a category is a
# word, not one appearance.

- type: representation
  id: zh-qing-srgb-editorial
  concept: zh-qing
  review_state: extracted
  rights_status: user-adaptation
  evidence: { source: super-colour-wuxing-display, locator: '青: #2f7f78' }
  space: srgb
  coords: [0.18431373, 0.49803922, 0.47058824]
  white: D65
  profile: sRGB
  method: Super Colour editorial marker, chosen directly as #2f7f78 in sRGB so the Five Phases diagram and Laboratory sets can show the category. A blue-green was chosen because the sources say 青 covers both blue and green; no historical, pigment or measurement basis.
  approximation_status: modern-approximation
  notes: 青 is a colour category spanning blue and green. This marker stands for the word in diagrams; it is not a value of 青.

