# yaml-language-server: $schema=../schema.json
# Wuxing (五行), the Five Phases, as a sourced learning module. Phases and colour categories are separate concepts.
# Every relationship names the passage it rests on. The IEP article states colour/season/direction only for wood and fire;
# the remaining correspondences come from an uncited Wikipedia table and are marked as such.

- type: concept
  id: zh-wuxing
  review_state: bibliographic
  rights_status: verified-restricted
  evidence: { source: iep-wuxing-littlejohn, locator: 'introduction' }
  label: Wuxing (五行), the Five Phases
  description: >-
    "These five phases are wood (mu), fire (huo), earth (tu), metal (jin), and water (shui)" (IEP, introduction).
    A framework of interconnected processes and correspondences, not five chemical elements and not a colour standard.
  tags: { tradition: chinese, language: zh, kind: system }

