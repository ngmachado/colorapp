# Seasons and directions, as cultural assertions attached to the phase.
- type: cultural-assertion
  id: zh-wuxing-wood-season-direction
  review_state: bibliographic
  rights_status: verified-restricted
  evidence: { source: iep-wuxing-littlejohn, locator: 'section 4' }
  concept: zh-wuxing-wood
  claim: Wood is correlated with the spring season and the direction east.
  passage: 'Wood is also correlated with the color blue-green, the spring season, the direction east'
  period: Han dynasty and after, per the section heading
- type: cultural-assertion
  id: zh-wuxing-fire-season
  review_state: bibliographic
  rights_status: verified-restricted
  evidence: { source: iep-wuxing-littlejohn, locator: 'section 3' }
  concept: zh-wuxing-fire
  claim: Fire is correlated with summer.
  passage: '(wood, green, spring; or fire, red, summer)'
  period: Before the Han dynasty, per the section heading
- type: cultural-assertion
  id: zh-wuxing-table-remaining
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wikipedia-en-wuxing, locator: 'correspondences table (uncited)' }
  concept: zh-wuxing
  claim: >-
    The table gives Fire: south; Earth: centre, intermediate season; Metal: west, autumn; Water: north, winter.
    These are not confirmed by the IEP article and await a scholarly source.
- type: cultural-assertion
  id: zh-qing-grue
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wiktionary-en, locator: '/wiki/青, usage notes' }
  concept: zh-qing
  claim: 青 covered both green and blue until modern times; blue and black senses are more common in Classical Chinese, green in modern Chinese.
  passage: 'In fact, 青 covered both green and blue.'
