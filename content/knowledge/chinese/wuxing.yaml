# The five colour categories (wu se). The IEP article lists them in English only:
# "five colors (wu se – green, yellow, black, red, and white)" (section 3). Characters and pinyin from Wiktionary.
- type: concept
  id: zh-qing
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wiktionary-en, locator: '/wiki/青' }
  label: 青 (qīng)
  description: A colour category covering blue and green; "In fact, 青 covered both green and blue" (Wiktionary). Do not force it into one hue.
  tags: { tradition: chinese, kind: colour-category }
- type: name
  id: zh-qing-name
  review_state: discovered
  rights_status: unreviewed
  evidence: { source: wiktionary-en, locator: '/wiki/青' }
  concept: zh-qing
  script: 青
  language: zh
  transliteration: { system: Hanyu Pinyin, value: qīng }
  meaning: 'blue-green; blue (of sky, stone); green (of grass, plants, mountains); black (of hair, cloth, silk thread)'
  confidence: { transcription: 1 }
