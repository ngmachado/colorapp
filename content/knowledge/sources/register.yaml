- type: source
  id: chevreul-1890-principles-martel
  review_state: bibliographic
  rights_status: verified-reusable
  author: Michel Eugène Chevreul; translated by Charles Martel
  title: The Principles of Harmony and Contrast of Colours, and Their Applications to the Arts
  publisher: George Bell and Sons, London (per Internet Archive metadata)
  date: '1890'
  edition: Third edition, with a new introduction for the unscientific reader and a complete index
  url: https://archive.org/details/b21285676
  archive_id: b21285676
  access_date: '2026-10-14'
  rights_notes: >-
    Scan from the Wellcome Collection, whose record states the work can be used for any purpose without restriction under
    copyright law. The OCR text is used for locators; passages are checked against the page images before promotion.
  notes: >-
    Chevreul's numbered paragraphs are printed as "(16.)" and are the locators. The translator's preface to the third edition
    is dated September 1860; the Internet Archive dates this printing 1890. The OCR does not show the title-page imprint, so the
    publisher is taken from the archive record.

