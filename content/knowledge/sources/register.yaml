- type: source
  id: kandinsky-1914-spiritual-in-art-sadleir
  review_state: bibliographic
  rights_status: verified-reusable
  author: Wassily Kandinsky; translated by Michael Sadleir (M. T. H. Sadler)
  title: Concerning the Spiritual in Art (published in 1914 as The Art of Spiritual Harmony)
  publisher: Constable, London (1914); Project Gutenberg eBook 5321 (2004, updated 2011)
  date: '1914'
  url: https://www.gutenberg.org/ebooks/5321
  access_date: '2026-10-30'
  rights_notes: >-
    Project Gutenberg distributes the 1914 English translation as public domain in the United States. The
    German original (Über das Geistige in der Kunst, 1911; Kandinsky died 1944) is public domain everywhere;
    the translator died in 1957, so the translation stays in copyright until the end of 2027 where the term is
    life plus seventy years. Passages are kept to one or two sentences, with citation, for that reason.
  notes: >-
    The Gutenberg text carries no page numbers; locators name the chapter (VI, The Language of Form and
    Colour), a figure, or the opening words of the paragraph. Kandinsky's own footnote says these statements
    "have no scientific basis, but are founded purely on spiritual experience"; the records keep that
    framing. Quoted from the plain-text file pg5321.txt downloaded on 2026-10-30.

