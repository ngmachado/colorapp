- type: source
  id: munsell-1907-a-color-notation
  review_state: bibliographic
  rights_status: verified-reusable
  author: Albert H. Munsell
  title: 'A Color Notation: a measured color system, based on the three qualities Hue, Value, and Chroma'
  publisher: Geo. H. Ellis Co., Boston; Project Gutenberg eBook 26054 (2008)
  date: '1907'
  edition: Second edition, revised and enlarged (first edition 1905)
  url: https://www.gutenberg.org/ebooks/26054
  access_date: '2026-10-30'
  rights_notes: >-
    Public domain (Munsell died in 1918; copyright 1905 and 1907), distributed by Project Gutenberg under its
    licence. Passages are quoted from the plain-text file pg26054.txt downloaded on 2026-10-30; the file's
    emphasis markers (_value_) are dropped.
  notes: >-
    Munsell's numbered paragraphs, printed "(20)", are the locators. This 1907 text predates the 1915 Atlas and
    the 1943 renotation: its hue scale has ten steps written by initials (R 5/9), its value scale runs 0 to 10,
    and its chroma scale is open-ended. The notations on /munsell and in the JIS records are the later form
    (5R 4/14) and are not this book's values.

