  title: 'Living Colours: Kasane – the Language of Japanese Colour Combinations'
  date: '2019'
  url: https://www.japanhouselondon.uk/whats-on/living-colours-kasane-the-language-of-japanese-colour-combinations/
  access_date: '2026-10-13'
  notes: >-
    Exhibition with the Yoshioka Dyeing Workshop, Kyoto (Yoshioka Sachio, 5th generation; Sarasa, 6th). Related events during
