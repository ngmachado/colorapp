# yaml-language-server: $schema=../schema.json
# Munsell's colour notation as his 1907 book states it: three measured qualities (hue, value, chroma), a sphere with
# white and black at the poles and neutral grey on the axis, ten middle hues round the equator written by initials, and
# five pairs of opposites that unite in neutral grey. Swatches are editorial illustrations; every claim has its paragraph.

- type: concept
  id: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraphs 20–25, 31, 40–41, 61–62 and 75–76' }
  label: Munsell’s colour notation (1907)
  description: Munsell names every colour by three measured qualities, hue, value and chroma, placed on a sphere whose poles are white and black, whose axis is neutral grey and whose equator carries ten middle hues written by initials, R, YR, Y, GY, G, BG, B, PB, P and RP. A notation such as R 5/9 fixes a colour so that “it cannot be mistaken for any other”; opposites across the centre balance each other and unite in neutral grey.
  scope: This entry models the ten middle hues, the five pairs of opposites and Munsell’s definitions, from the 1907 second edition. The later Atlas hue steps (5R, 7.5R) and the 1943 renotation that /munsell looks up are not this book; the JIS records carry those later notations. Swatches are editorial sRGB illustrations, not readings of the book’s plates.
  tags: { tradition: western, kind: system, period: '1905; second edition, 1907' }

