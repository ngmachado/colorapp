  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraphs 31 and 40–41' }
  label: Red, R (Munsell)
  description: One of Munsell’s five principal hues, written R, at middle value on the equator of his sphere (“a middle red will be written R 5/”). Its name and relationships do not specify a unique RGB value.
  tags: { tradition: western, kind: colour }

