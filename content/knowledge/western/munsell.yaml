# ---- Munsell’s sentences ----

- type: cultural-assertion
  id: munsell-three-qualities
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraphs 20–23' }
  claim: Munsell defines colour by three qualities, hue, value and chroma, each with its own scale.
  passage: 'The three color qualities are hue, value, and chroma. Hue is the quality by which we distinguish one color from another, as a red from a yellow, a green, a blue, or a purple. Value is the quality by which we distinguish a light color from a dark one. Chroma is the quality by which we distinguish a strong color from a weak one.'
  period: '1905; second edition, 1907'
  context: Chapter I, Color Names
  notes: Four sentences from four consecutive paragraphs (20, 21, 22, 23), each paragraph's opening sentence.

- type: cultural-assertion
  id: munsell-sphere
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraph 25' }
  claim: Munsell’s sphere has white and black at the poles, value on the vertical axis, hue round the equator and chroma outward from the neutral grey axis.
  passage: 'The north pole of the color sphere is white, and the south pole black. Value or luminosity of colors ranges between these two extremes.'
  period: '1905; second edition, 1907'
  context: Chapter I, Color Names
  notes: 'The paragraph goes on: hues are spread around the equator; a line inward from the strong surface hues to the neutral grey axis traces loss of chroma.'

- type: cultural-assertion
  id: munsell-ten-hues
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraph 31' }
  claim: The equator of Munsell’s sphere is divided into ten hues written by initials, with value from 0 to 10 on the axis and chroma numbered outward.
  passage: 'The equator of the sphere may be divided into ten parts, and serve as the scale of hue, marked R, YR, Y, GY, G, BG, B, PB, P, and RP. Its vertical axis may be divided into ten parts to serve as the scale of value, numbered from black (0) to white (10). Any perpendicular to the neutral axis is a scale of chroma.'
  period: '1905; second edition, 1907'
  context: Chapter II, Color Qualities
  notes: Footnote 11 credits Runge (1810) with the sphere and Lambert with a pyramid, and objects that both assume red, yellow and blue as primary sensations.

- type: cultural-assertion
  id: munsell-notation
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraph 40' }
  claim: The notation writes hue as an initial, value above the line and chroma below it; R 5/9 is Munsell’s example, the pigment vermilion.
  passage: 'Thus R 5/9 means HUE (red), VALUE (5)/CHROMA (9), and will be found to represent the qualities of the pigment vermilion.'
  period: '1905; second edition, 1907'
  context: Chapter II, Color Qualities
  notes: 'The five principal hues are “R (red), Y (yellow), G (green), B (blue), and P (purple)”; the intermediates “YR (yellow-red), GY (green-yellow), BG (blue-green), PB (purple-blue), and RP (red-purple)”.'

- type: cultural-assertion
  id: munsell-harmony-personal
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraphs 46–47' }
  claim: Munsell holds colour harmony to be personal and resists musical analogies; what his system supplies is measured scales from which each person chooses.
  passage: 'Color harmony, as now treated, is a purely personal affair, difficult to refer to any clear principles or definite laws. The very terms by which it seeks expression are borrowed from music, and suggest vague analogies that fail when put to the test.'
  period: '1905; second edition, 1907'
  context: Chapter II, Color Qualities
  notes: 'Paragraph 47 ends: “From these color scales each individual is free to choose combinations in accord with his feeling for color harmony.” The app’s wheel recipes are app choices, not his.'

- type: cultural-assertion
  id: munsell-balance
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraphs 75–76' }
  claim: For Munsell the centre of the sphere, middle grey, is the balancing point; colours equally removed from it on a line through the centre balance and are called complementary.
  passage: 'In short, every straight line through this centre indicates opposite qualities that balance one another. The color points so found are said to be “complementary,” for each supplies what is needed to complement or balance the other in hue, value, and chroma.'
  period: '1905; second edition, 1907'
  context: Chapter III, Color Mixture, a tri-dimensional balance
  notes: Paragraph 77 adds area as a compensation when one colour cannot match the other’s chroma.

- type: cultural-assertion
  id: munsell-red-opposite
  concept: munsell-r
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraph 61 and footnote 18' }
  claim: Munsell places blue-green, not green, opposite red, and says so against the common assignment.
  passage: 'A line drawn from red, through the centre, finds its opposite, blue-green. If these colors are mixed, they unite to form gray.'
  period: '1905; second edition, 1907'
  context: Chapter III, Color Mixture, a tri-dimensional balance
  notes: 'Footnote 18: “Green is often wrongly assigned as the opposite of red. See Appendix, on False Color Balance.” Chevreul’s circle and Kandinsky’s antitheses in this release pair red with green; the sources disagree and both are kept.'

- type: cultural-assertion
  id: munsell-opposites-side-by-side
  concept: munsell-system
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: munsell-1907-a-color-notation, locator: 'Paragraph 63' }
  claim: Opposite hues enhance each other when placed side by side and destroy each other when mixed.
  passage: 'But if, instead of mixing these opposite hues, we place them side by side, the eye is so stimulated by their difference that each seems to gain in strength; i.e., each enhances the other when separate, but destroys the other when mixed.'
  period: '1905; second edition, 1907'
  context: Chapter III, Color Mixture, a tri-dimensional balance
