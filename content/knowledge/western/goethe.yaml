# yaml-language-server: $schema=../schema.json
# Goethe's colour circle (1810) as a sourced system: six colours, two sides, three complements, four characteristic chords.
# Every passage is copied from the Eastlake translation (Project Gutenberg 50572) with Goethe's paragraph number. Nothing is written from memory.
# Display values are the app's own approximations: Goethe gives no measurements. They carry rights_status "approximate" and say so in method.
# review_state "extracted": copied 2026-10-17; rights-check and specialist review pending.

# ---- the system and its two sides ----

- type: concept
  id: goethe-circle
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '696–707' }
  label: Goethe's colour circle
  description: >-
    Two principles in polarity, yellow (plus) and blue (minus), each deepening towards red; their simple union is green,
    their deepened junction pure red, which Goethe calls purpur. Six colours on a circle: diameters give the complements
    the eye demands, chords that skip a colour give the characteristic pairs. A system of felt oppositions, not a wheel rule.
  tags: { tradition: western, system: goethe, kind: system, period: '1810' }

- type: concept
  id: goethe-plus
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '696, 764' }
  label: Plus side (Goethe)
  description: >-
    Yellow and its deepening towards red. Goethe's table under 696 sets against it: action, light, brightness, force,
    warmth, proximity, repulsion, affinity with acids.
  tags: { tradition: western, system: goethe, kind: side }

- type: concept
  id: goethe-minus
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '696, 777' }
  label: Minus side (Goethe)
  description: >-
    Blue and its deepening towards red. Goethe's table under 696 sets against it: negation, shadow, darkness, weakness,
    coldness, distance, attraction, affinity with alkalis.
  tags: { tradition: western, system: goethe, kind: side }

