# Western colour theories. Only public-domain texts are quoted, by the author's own paragraph numbers.
# Itten and Albers have bibliographic source records and nothing reproduced. Nothing is written from memory.
# review_state "extracted": passages copied from the cited text on 2026-10-14; rights-check and specialist review pending.

- type: cultural-assertion
  id: goethe-plus-side
  review_state: extracted
  rights_status: verified-reusable
  concept: goethe-plus
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '764' }
  claim: Goethe groups yellow, red-yellow (orange) and yellow-red on the "plus" side of his colour circle and ascribes a quick, lively, aspiring feeling to them.
  passage: 'The colours on the plus side are yellow, red-yellow (orange), yellow-red (minium, cinnabar). The feelings they excite are quick, lively, aspiring.'
  period: '1810 (German original); 1840 (this translation)'
  context: Part VI, Effect of colour with reference to moral associations
  notes: A statement about felt effect in Goethe's system, not a rule the generator applies.

- type: cultural-assertion
  id: goethe-yellow-nearest-light
  review_state: extracted
  rights_status: verified-reusable
  concept: goethe-yellow
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '765' }
  claim: Goethe calls yellow the colour nearest the light.
  passage: 'This is the colour nearest the light. It appears on the slightest mitigation of light, whether by semi-transparent mediums or faint reflection from white surfaces.'
  period: '1810 (German original); 1840 (this translation)'
  context: Part VI, under "Yellow"

