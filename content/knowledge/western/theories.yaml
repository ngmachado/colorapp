- type: cultural-assertion
  id: goethe-completeness
  review_state: extracted
  rights_status: verified-reusable
  concept: goethe-circle
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '805–806' }
  claim: Goethe's harmony rests on completeness; the eye, shown one colour, produces its complement and seeks a colourless space to do so.
  passage: 'When the eye sees a colour it is immediately excited, and it is its nature, spontaneously and of necessity, at once to produce another, which with the original colour comprehends the whole chromatic scale. A single colour excites, by a specific sensation, the tendency to universality. To experience this completeness, to satisfy itself, the eye seeks for a colourless space next every hue in order to produce the complemental hue upon it.'
  period: '1810 (German original); 1840 (this translation)'
  context: Part VI, "Completeness and Harmony"
  notes: Goethe's complement is a physiological after-image, not a wheel diameter. The app's complementary rule is a hue-angle rule and is not this.

- type: cultural-assertion
  id: goethe-harmony-law
  review_state: extracted
  rights_status: verified-reusable
  concept: goethe-circle
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '807' }
  claim: Goethe names the eye's demand for the complement the fundamental law of all harmony of colours.
  passage: 'In this resides the fundamental law of all harmony of colours, of which every one may convince himself by making himself accurately acquainted with the experiments which we have described in the chapter on the physiological colours.'
  period: '1810 (German original); 1840 (this translation)'
  context: Part VI, "Completeness and Harmony"

- type: cultural-assertion
  id: goethe-characteristic-combinations
  review_state: extracted
  rights_status: verified-reusable
  concept: goethe-circle
  evidence: { source: goethe-1840-theory-of-colours-eastlake, locator: '816–817' }
  claim: Goethe distinguishes "characteristic" combinations, found on the circle by chords that skip one intermediate colour, from the harmonious ones found by diameters.
  passage: 'Besides these pure, harmonious, self-developed combinations, which always carry the conditions of completeness with them, there are others which may be arbitrarily produced, and which may be most easily described by observing that they are to be found in the colorific circle, not by diameters, but by chords, in such a manner that an intermediate colour is passed over. We call these combinations characteristic because they have all a certain significancy and tend to excite a definite impression; an impression, however, which does not altogether satisfy, inasmuch as every characteristic quality of necessity presents itself only as a part of a whole, with which it has a relation, but into which it cannot be resolved.'
  period: '1810 (German original); 1840 (this translation)'
  context: Part VI, "Completeness and Harmony"
  notes: Goethe's six-colour circle makes a chord that skips one colour a 120° step; the app's triadic rule on the OKLCh wheel is a different wheel and is not this.

- type: cultural-assertion
  id: chevreul-law-of-simultaneous-contrast
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: chevreul-1890-principles-martel, locator: '(16.)' }
  claim: Chevreul's law of simultaneous contrast; two contiguous colours seen together appear as different as possible in composition and tone.
  passage: 'In the case where the eye sees at the same time two contiguous colours, they will appear as dissimilar as possible, both in their optical composition and in the height of their tone.'
  period: '1839 (French original); 1890 (this printing of the 1854 Martel translation)'
  context: Part I, Introduction
  notes: OCR of the scan reads "ivJiere" and "dissi?nilar" for "where" and "dissimilar"; the passage is given corrected and must be checked against the page image before promotion.

- type: cultural-assertion
  id: chevreul-complementary-pairs
  review_state: extracted
  rights_status: verified-reusable
  evidence: { source: chevreul-1890-principles-martel, locator: "Translator's Introduction, 'Complementary Colours'" }
  claim: The translator's introduction states the complementary pairs used throughout the book; blue with orange, red with green, yellow with violet.
  passage: 'Blue is the complementary of Orange (Red and Yellow). Red is the complementary of Green (Blue and Yellow). Yellow is the complementary of Violet (Blue and Red).'
  period: '1890 (this printing)'
  context: Translator's introduction for the unscientific reader; unnumbered
  notes: These are pigment-mixing complements of the nineteenth century, not opposites on the OKLCh wheel. Chevreul's own definition is at (161.) and (170.), by the diameter of his chromatic circle.
