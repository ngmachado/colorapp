# Six named landmarks of a larger historical construction, not a reconstruction of its plates.
- type: concept
  id: chevreul-circle
  review_state: extracted
  rights_status: verified-reusable
  evidence:
    {
      source: chevreul-1890-principles-martel,
      locator: 'Part II, Prolegomena, paragraphs 159–170, printed pp. 58–63',
    }
  label: Chevreul’s chromatic circle
  description: Chevreul places red, yellow and blue at intervals of 120 degrees, then inserts orange, green and violet. Colours at opposite ends of a diameter are complementary in his construction. He subdivides the circle into 72 scales, each with 20 tones; the normal tone differs between scales. His further hemispherical construction adds gradations towards black.
  scope: This entry models six named landmarks and three complementary pairs, alongside his law of simultaneous contrast. It does not reproduce all 72 scales, the tone steps or the hemisphere. Swatches are editorial sRGB illustrations, not measurements of the plates, historical pigment recipes or modern scientific primaries. The Laboratory plots these illustrations in OKLCh; its angles need not match the historical circle.
  tags: { tradition: western, kind: system, period: '1839; Martel translation, 1890 printing' }

