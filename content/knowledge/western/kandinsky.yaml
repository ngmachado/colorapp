# yaml-language-server: $schema=../schema.json
# Kandinsky's four pairs of antitheses (Concerning the Spiritual in Art, chapter VI, figures I–III) in the 1914
# Sadleir translation: yellow and blue, white and black, red and green, orange and violet, with his sentence on
# each colour. He says himself that these statements have no scientific basis; the records keep that framing.

- type: concept
  id: kandinsky-antitheses
  review_state: extracted
  rights_status: verified-reusable
  evidence:
    {
      source: kandinsky-1914-spiritual-in-art-sadleir,
      locator: 'Chapter VI, The Language of Form and Colour, figures I–III',
    }
  label: Kandinsky’s antitheses
  description: Kandinsky arranges six colours in a circle between two poles, white and black, as four pairs of antitheses. Yellow against blue is the first (warm against cold), white against black the second (light against dark), red against green the third and orange against violet the fourth, the last two as complementary colours. Each colour then receives a sentence on its “inner appeal”.
  scope: This entry models the four pairs and the circle of figure III, with Kandinsky’s own sentences on each colour. His footnote states that these claims “have no scientific basis, but are founded purely on spiritual experience”; the app records them as his, not as findings. Swatches are editorial sRGB illustrations; he gives no pigments or measurements.
  tags: { tradition: western, kind: system, period: '1911; Sadleir translation, 1914' }

