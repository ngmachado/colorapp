services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sca:${POSTGRES_PASSWORD:-sca}@postgres:5432/sca
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      AUTH_URL: https://localhost
      EMAIL_SERVER: smtp://mailpit:1025
      EMAIL_FROM: Super Colour <noreply@localhost>
    depends_on:
      - postgres
      - mailpit

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sca}
      POSTGRES_DB: sca
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local mail catcher: sign-in links land here. UI at http://localhost:8025. Replace with a real SMTP server in production.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      # SMTP on the host too, so `pnpm dev` with AUTH_DISABLED=0 can send a magic link (see .env.example).
      - '1025:1025'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy:
